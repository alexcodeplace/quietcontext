[package]
name = "qc-native"
version = "0.1.0"
edition = "2021"
description = "QuietContext native command filtering and repository navigation engine"
publish = false

[[bin]]
name = "qc-native"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
regex = "1"
ignore = "0.4"
notify = "8"
dirs = "5"
libc = "0.2"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
