name: Native qc qualification

on:
  workflow_dispatch:
  push:
    branches: [main, next]
    paths:
      - "native/qc/**"
      - "src/native-qc.ts"
      - "scripts/stage-qc-native.mjs"
      - "scripts/verify-staged-qc-native.mjs"
      - "tests/qc-native-*.test.ts"
      - "package.json"
      - ".github/workflows/native-qc-windows.yml"
  pull_request:
    branches: [main, next]
    paths:
      - "native/qc/**"
      - "src/native-qc.ts"
      - "scripts/stage-qc-native.mjs"
      - "scripts/verify-staged-qc-native.mjs"
      - "tests/qc-native-*.test.ts"
      - "package.json"
      - ".github/workflows/native-qc-windows.yml"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            key: linux-x64
          - os: windows-latest
            key: win32-x64
    runs-on: ${{ matrix.os }}
    name: qc-native (${{ matrix.key }})
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.5"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source
        run: |
          npm run typecheck
          npm run lint
          cargo fmt --all --check --manifest-path native/qc/Cargo.toml
          cargo clippy --all-targets --manifest-path native/qc/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path native/qc/Cargo.toml

      - name: Stage native runtime
        run: npm run native:stage

      - name: Verify staged artifact
        run: npm run native:verify -- ${{ matrix.key }}

      - name: Run authoritative package tests
        run: npm test

      - name: Run native integration tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          QUIET_CONTEXT_NATIVE_TEST_BIN="$PWD/vendor/qc-native/linux-x64/qc-native" \
            QUIET_CONTEXT_NATIVE_ALLOW_OVERRIDE=1 \
            npm run test:native

      - name: Run native integration tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QUIET_CONTEXT_NATIVE_TEST_BIN = (Resolve-Path "vendor/qc-native/win32-x64/qc-native.exe").Path
          $env:QUIET_CONTEXT_NATIVE_ALLOW_OVERRIDE = "1"
          npm run test:native
